{% extends "base.html" %}
{% block titre %}Modifier une catégorie{% endblock %}
{% block contenu %}
<h1 class="mb-4">Modifier la catégorie n° {{ categorie.id_categorie }}</h1>
<div class="card p-4" style="max-width: 520px">
  <form method="post">
    <label class="form-label">Libellé</label>
    <input class="form-control mb-3" name="libelle" value="{{ categorie.libelle }}" maxlength="100" required>
    <button class="btn btn-primary">Enregistrer</button>
    <a class="btn btn-link" href="{{ url_for('categories') }}">Annuler</a>
  </form>
</div>
{% endblock %}
